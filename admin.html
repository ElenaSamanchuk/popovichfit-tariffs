<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка тарифов PopovichFit</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .admin-pick { max-width: 560px; margin: 48px auto; padding: 0 20px; }
    .admin-pick h1 { margin-bottom: 8px; }
    .admin-pick .lead { margin-bottom: 20px; }
  </style>
</head>
<body>
  <main class="admin-pick">
    <h1>Админка тарифов</h1>
    <p class="lead">Выберите курс. Дальше — обычные поля, превью справа и кнопка «Сохранить».</p>
    <div class="course-tabs">
      <a class="course-tab" href="admin-korrekciya.html">Коррекция</a>
      <a class="course-tab" href="admin-silovye.html">Силовые</a>
    </div>
    <p class="hint">Каждая админка правит только свой курс. Превью — черновик. На сайт и в Тильду изменения попадают после «Сохранить».</p>
  </main>
  <script>
    (function () {
      var course = new URLSearchParams(location.search).get("course");
      if (course === "korrekciya") location.replace("admin-korrekciya.html");
      if (course === "silovye" || course === "silovoj") location.replace("admin-silovye.html");
    })();
  </script>
</body>
</html>
